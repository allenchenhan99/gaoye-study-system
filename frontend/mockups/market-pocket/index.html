<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18332b" />
    <title>股市掌機｜高業考古題</title>
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="lab-return pixel-type" href="../index.html">← Visual lab / 01</a>

    <main class="handheld" aria-labelledby="pocket-title">
      <div class="shell-top">
        <span class="brand pixel-type">Market Pocket</span>
        <span class="power"><i></i> Power</span>
      </div>

      <section class="screen-bezel" aria-label="股市掌機畫面">
        <div class="screen">
          <header class="screen-header">
            <div>
              <p class="micro pixel-type">Securities Level-Up</p>
              <h1 id="pocket-title">股市掌機</h1>
              <p class="subtitle">證券商高級業務員</p>
            </div>
            <div class="battery" aria-label="電量 4 格"><i></i><i></i><i></i><i></i></div>
          </header>

          <div class="market-strip">
            <div class="pixel-chart" aria-hidden="true">
              <i style="--h:40%;--y:42%"></i><i style="--h:58%;--y:28%"></i><i style="--h:34%;--y:52%"></i>
              <i style="--h:70%;--y:16%"></i><i style="--h:52%;--y:31%"></i><i style="--h:78%;--y:8%"></i>
              <i style="--h:64%;--y:20%"></i><i style="--h:88%;--y:2%"></i><i style="--h:72%;--y:14%"></i>
            </div>
            <div>
              <span class="pixel-type">Question Bank</span>
              <strong>5,400</strong><small> 題已載入</small>
            </div>
          </div>

          <div class="hud" aria-label="學習統計">
            <div><span>已作答</span><strong>326</strong></div>
            <div><span>正確率</span><strong>78%</strong></div>
            <div><span>錯題</span><strong>18</strong></div>
          </div>

          <nav class="game-menu" aria-label="練習模式">
            <a href="#"><b>01</b><span><strong>年份練習</strong><small>選年份與考科</small></span><em>▶</em></a>
            <a href="#"><b>02</b><span><strong>隨機練習</strong><small>快速抽 20 題</small></span><em>▶</em></a>
            <a href="#"><b>03</b><span><strong>科目練習</strong><small>集中升級弱科</small></span><em>▶</em></a>
            <a class="boss" href="#"><b>04</b><span><strong>模擬考</strong><small>50 題 · 60:00</small></span><em>▶</em></a>
          </nav>

          <nav class="utility-menu" aria-label="複習工具">
            <a href="#"><svg class="pixel-icon"><use href="../assets/pixel-icons.svg#warning"></use></svg>錯題本</a>
            <a href="#"><svg class="pixel-icon"><use href="../assets/pixel-icons.svg#star"></use></svg>收藏</a>
            <a href="#"><svg class="pixel-icon"><use href="../assets/pixel-icons.svg#chart"></use></svg>統計</a>
          </nav>
        </div>
      </section>

      <section class="controls" aria-hidden="true">
        <div class="dpad"><i></i><i></i></div>
        <div class="speaker"><i></i><i></i><i></i><i></i></div>
        <div class="action-buttons"><span class="key-b">B</span><span class="key-a">A</span></div>
      </section>

      <p class="shell-note pixel-type">Local save / Rev. 114-Q4</p>
    </main>
  </body>
</html>
